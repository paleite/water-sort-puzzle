name: Generate thirty additional levels

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-more-levels.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate levels 021-050
        run: pnpm exec tsx scripts/water-sort/generate-levels.ts --count 30 --start-id 21 --append --seed 50000

      - name: Verify all levels
        run: pnpm run verify:levels

      - name: Commit generated levels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/levels
          git diff --cached --quiet && exit 0
          git commit -m "Add levels 021 through 050"
          git push
